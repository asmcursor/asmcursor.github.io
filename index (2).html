<style>
  :root {
    --papier: #FBF8F1;
    --tinte: #110F0C;
    --tinte-leicht: #6b6558;
    --linie: #e3ddcf;
    --marker: #f3e6ae;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--papier); }

  body {
    font-family: "Baskerville Old Face", Baskerville, "Libre Baskerville", "Times New Roman", serif;
    color: var(--tinte);
    background: var(--papier);
    line-height: 1.65;
    min-height: 100vh;
  }

  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: inherit; color: var(--tinte); }

  /* ---------- Startseite (Sprachwahl) ---------- */
  #splash {
    position: fixed;
    inset: 0;
    background: var(--papier);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    transition: opacity .45s ease;
  }

  #splash.aus { opacity: 0; pointer-events: none; }

  .splash-logo { display: flex; align-items: center; }
  .splash-logo img { height: 96px; width: auto; display: block; }
  .splash-logo .cursor { height: 84px; width: 3px; margin-left: 9px; }

  .sprachwahl { position: relative; text-align: center; }

  .sprachwahl > button {
    font-size: 1.05rem;
    font-style: italic;
    color: var(--tinte-leicht);
    border-bottom: 1px solid var(--tinte);
    padding: 0.3rem 0.6rem;
  }

  .sprachwahl > button:hover, .sprachwahl > button:focus-visible { color: var(--tinte); }

  .sprachliste {
    list-style: none;
    margin-top: 0.9rem;
    display: none;
  }

  .sprachwahl.offen .sprachliste { display: block; }

  .sprachliste button {
    font-size: 1.05rem;
    padding: 0.35rem 0.6rem;
    display: block;
    width: 100%;
  }

  .sprachliste button:hover, .sprachliste button:focus-visible { background: var(--marker); }

  /* ---------- Kopf ---------- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 2rem;
    padding: 2rem 2.25rem 0;
    flex-wrap: wrap;
  }

  .logo { display: flex; align-items: center; }
  .logo img { height: 52px; width: auto; display: block; }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 46px;
    margin-left: 6px;
    background: var(--tinte);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

  .suche { margin-top: 0.8rem; }

  .suche input {
    font-size: 1rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--tinte);
    padding: 0.3rem 0.1rem;
    width: min(260px, 60vw);
    outline: none;
  }

  .suche input::placeholder { color: var(--tinte-leicht); font-style: italic; }
  .suche input:focus { border-bottom-width: 2px; }

  .such-status {
    font-size: 0.85rem;
    font-style: italic;
    color: var(--tinte-leicht);
    margin-top: 0.35rem;
    min-height: 1.2em;
    text-align: right;
  }

  /* ---------- Einträge ---------- */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 6rem;
  }

  .eintrag { padding: 2.2rem 0; border-bottom: 1px solid var(--linie); }
  .eintrag:first-child { padding-top: 0; }
  .eintrag:last-child { border-bottom: none; }

  .eintrag time {
    display: block;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tinte-leicht);
    margin-bottom: 0.8rem;
  }

  .eintrag p { font-size: 1.08rem; margin-bottom: 1em; }
  .eintrag p:last-child { margin-bottom: 0; }

  mark { background: var(--marker); color: inherit; padding: 0 0.1em; }

  .leer {
    text-align: center;
    font-style: italic;
    color: var(--tinte-leicht);
    padding: 3rem 0;
  }

  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--tinte-leicht);
    padding: 0 1.5rem 2.5rem;
  }

  /* ---------- Overlays (Login & Neuer Eintrag) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgba(251, 248, 241, 0.55);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }

  .overlay.offen { display: flex; }

  .overlay-inhalt {
    width: min(440px, 100%);
    text-align: center;
  }

  .overlay-inhalt h2 {
    font-weight: 400;
    font-size: 1.15rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.6rem;
  }

  .feld {
    width: 100%;
    font-size: 1rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--tinte);
    padding: 0.4rem 0.1rem;
    outline: none;
    margin-bottom: 1.2rem;
  }

  .feld::placeholder { color: var(--tinte-leicht); font-style: italic; }
  .feld:focus { border-bottom-width: 2px; }

  textarea.feld {
    min-height: 130px;
    resize: vertical;
    line-height: 1.6;
    text-align: left;
  }

  .feld-label {
    display: block;
    text-align: left;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--tinte-leicht);
    margin-bottom: 0.3rem;
  }

  .knopf {
    font-size: 1rem;
    border-bottom: 1px solid var(--tinte);
    padding: 0.3rem 0.5rem;
  }

  .knopf:hover, .knopf:focus-visible { background: var(--marker); }

  .knopf-reihe { display: flex; justify-content: center; gap: 1.8rem; margin-top: 0.4rem; }

  .hinweis {
    font-size: 0.85rem;
    font-style: italic;
    color: var(--tinte-leicht);
    margin-top: 1.4rem;
    min-height: 1.2em;
  }

  .fehler { color: #8a3324; }

  .kontakt {
    margin-top: 2.2rem;
    font-size: 0.85rem;
    color: var(--tinte-leicht);
  }

  .kontakt a { color: inherit; }

  /* ---------- Admin-Leiste ---------- */
  #adminLeiste {
    position: fixed;
    right: 1.6rem;
    bottom: 1.6rem;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    z-index: 30;
  }

  #adminLeiste.offen { display: flex; }

  #plusKnopf {
    width: 52px;
    height: 52px;
    border: 1px solid var(--tinte);
    border-radius: 50%;
    font-size: 1.8rem;
    line-height: 1;
    background: var(--papier);
  }

  #plusKnopf:hover, #plusKnopf:focus-visible { background: var(--marker); }

  #abmelden {
    font-size: 0.78rem;
    font-style: italic;
    color: var(--tinte-leicht);
  }

  #abmelden:hover { color: var(--tinte); }

  @media (max-width: 560px) {
    header { padding: 1.4rem 1.25rem 0; }
    .logo img { height: 42px; }
    .logo .cursor { height: 37px; }
    main { padding-top: 3rem; }
    .splash-logo img { height: 68px; }
    .splash-logo .cursor { height: 60px; }
  }
</style>
</head>

    <textarea class="feld" id="textEn" placeholder="Entry in English …"></textarea>
    <div class="knopf-reihe">
      <button class="knopf" id="speichernKnopf">Speichern</button>
      <button class="knopf" id="editorAbbruch">Abbrechen</button>
    </div>
    <div class="hinweis" id="editorHinweis"></div>
  </div>
</div>

<!-- ---------- Admin-Leiste ---------- -->
<div id="adminLeiste">
  <button id="plusKnopf" aria-label="Neuer Eintrag">+</button>
  <button id="abmelden">Abmelden</button>
</div>

<script>
/* =====================================================================
   EINSTELLUNGEN
   ===================================================================== */
const REPO_BESITZER = "asmcursor";
const REPO_NAME     = "asmcursor.github.io";
const EINTRAGS_DATEI = "eintraege.json";

/* ---------- Übersetzungen der Oberfläche ---------- */
const TEXTE = {
  de: {
    suche: "Stichwort suchen …",
    gefunden1: "1 Eintrag gefunden",
    gefundenN: n => `${n} Einträge gefunden`,
    keinTreffer: b => `Kein Eintrag enthält „${b}“.`,
    fusszeile: j => `© ASM ${j} · Alle Rechte vorbehalten`,
    anmelden: "Anmelden", abbrechen: "Abbrechen", neuerEintrag: "Neuer Eintrag",
    speichern: "Speichern", abmelden: "Abmelden",
    schluessel: "Zugangsschlüssel",
    loginFehler: "Anmeldung fehlgeschlagen — Schlüssel prüfen.",
    speichernLäuft: "Wird gespeichert …",
    gespeichert: "Gespeichert. Für Besucher sichtbar in ca. einer Minute.",
    speicherFehler: "Speichern fehlgeschlagen — bitte erneut versuchen.",
    deFehlt: "Bitte zuerst den deutschen Text schreiben.",
    ladeFehler: "Einträge konnten nicht geladen werden."
  },
  en: {
    suche: "Search keyword …",
    gefunden1: "1 entry found",
    gefundenN: n => `${n} entries found`,
    keinTreffer: b => `No entry contains “${b}”.`,
    fusszeile: j => `© ASM ${j} · All rights reserved`,
    anmelden: "Log in", abbrechen: "Cancel", neuerEintrag: "New entry",
    speichern: "Save", abmelden: "Log out",
    schluessel: "Access key",
    loginFehler: "Login failed — check your key.",
    speichernLäuft: "Saving …",
    gespeichert: "Saved. Visible to visitors in about a minute.",
    speicherFehler: "Saving failed — please try again.",
    deFehlt: "Please write the German text first.",
    ladeFehler: "Entries could not be loaded."
  }
};

const MONATE_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONATE_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let SPRACHE = "de";
let EINTRAEGE = [];
let TOKEN = sessionStorage.getItem("asm_token") || "";

/* =====================================================================
   HILFSFUNKTIONEN
   ===================================================================== */
const $ = id => document.getElementById(id);
const t = () => TEXTE[SPRACHE];

function datumFormat(iso) {
  const [j, m, tg] = iso.split("-").map(Number);
  return SPRACHE === "en"
    ? `${MONATE_EN[m - 1]} ${tg}, ${j}`
    : `${tg}. ${MONATE_DE[m - 1]} ${j}`;
}

function escapeHTML(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function hervorheben(text, begriff) {
  if (!begriff) return text;
  const sicher = begriff.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp(`(${sicher})`, "gi"), "<mark>$1</mark>");
}

/* UTF-8 <-> Base64 (für die GitHub-API) */
function utf8ZuB64(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  }
  return btoa(bin);
}
function b64ZuUtf8(b) {
  const bin = atob(b.replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* =====================================================================
   EINTRÄGE LADEN & ANZEIGEN
   ===================================================================== */
async function ladeEintraege() {
  try {
    const antwort = await fetch(EINTRAGS_DATEI + "?t=" + Date.now(), { cache: "no-store" });
    if (!antwort.ok) throw new Error();
    EINTRAEGE = await antwort.json();
  } catch {
    EINTRAEGE = [];
    $("eintraege").innerHTML = `<div class="leer">${t().ladeFehler}</div>`;
    return;
  }
  rendern($("suchfeld").value);
}

function eintragsText(e) {
  return e[SPRACHE] || e.de || e.en || "";
}

function rendern(begriff = "") {
  const main = $("eintraege");
  const status = $("suchStatus");
  const b = begriff.trim().toLowerCase();

  const treffer = b
    ? EINTRAEGE.filter(e =>
        eintragsText(e).toLowerCase().includes(b) ||
        datumFormat(e.datum).toLowerCase().includes(b))
    : EINTRAEGE;

  if (treffer.length === 0 && b) {
    main.innerHTML = `<div class="leer">${t().keinTreffer(escapeHTML(begriff.trim()))}</div>`;
  } else {
    main.innerHTML = treffer.map(e => {
      const absaetze = eintragsText(e).split(/\n\s*\n/).map(a =>
        `<p>${hervorheben(escapeHTML(a), b ? begriff.trim() : "")}</p>`
      ).join("");
      return `<article class="eintrag">
        <time datetime="${e.datum}">${datumFormat(e.datum)}</time>
        ${absaetze}
      </article>`;
    }).join("");
  }

  status.textContent = b
    ? (treffer.length === 1 ? t().gefunden1 : t().gefundenN(treffer.length))
    : "";
}

/* =====================================================================
   SPRACHE & STARTSEITE
   ===================================================================== */
function sprachTexteAnwenden() {
  document.documentElement.lang = SPRACHE;
  $("suchfeld").placeholder = t().suche;
  $("fusszeile").textContent = t().fusszeile(new Date().getFullYear());
  $("editorTitel").textContent = t().neuerEintrag;
  $("speichernKnopf").textContent = t().speichern;
  $("editorAbbruch").textContent = t().abbrechen;
  $("abmelden").textContent = t().abmelden;
}

$("sprachKnopf").addEventListener("click", () => {
  const box = $("sprachwahl");
  box.classList.toggle("offen");
  $("sprachKnopf").setAttribute("aria-expanded", box.classList.contains("offen"));
});

document.querySelectorAll(".sprachliste button").forEach(k => {
  k.addEventListener("click", () => {
    SPRACHE = k.dataset.sprache;
    sprachTexteAnwenden();
    rendern($("suchfeld").value);
    $("splash").classList.add("aus");
  });
});

/* =====================================================================
   SUCHE
   ===================================================================== */
$("suchfeld").addEventListener("input", () => rendern($("suchfeld").value));
$("suchfeld").addEventListener("keydown", e => {
  if (e.key === "Escape") { $("suchfeld").value = ""; rendern(); $("suchfeld").blur(); }
});

/* =====================================================================
   LOGIN (über GitHub-API)
   ===================================================================== */
$("logoKnopf").addEventListener("click", () => {
  if (TOKEN) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  $("loginHinweis").textContent = "";
  $("loginOverlay").classList.add("offen");
  $("tokenFeld").focus();
});

/* Klick ausserhalb des Feldes schliesst das Login-Fenster */
$("loginOverlay").addEventListener("click", e => {
  if (e.target === $("loginOverlay")) $("loginOverlay").classList.remove("offen");
});

async function anmelden() {
  const token = $("tokenFeld").value.trim();
  if (!token) return;
  $("loginHinweis").className = "hinweis";
  $("loginHinweis").textContent = "…";
  try {
    const antwort = await fetch(`https://api.github.com/repos/${REPO_BESITZER}/${REPO_NAME}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const daten = await antwort.json();
    if (!antwort.ok || !daten.permissions || !daten.permissions.push) throw new Error();
    TOKEN = token;
    sessionStorage.setItem("asm_token", token);
    $("tokenFeld").value = "";
    $("loginOverlay").classList.remove("offen");
    $("adminLeiste").classList.add("offen");
  } catch {
    $("loginHinweis").className = "hinweis fehler";
    $("loginHinweis").textContent = t().loginFehler;
  }
}

$("tokenFeld").addEventListener("keydown", e => { if (e.key === "Enter") anmelden(); });

$("abmelden").addEventListener("click", () => {
  TOKEN = "";
  sessionStorage.removeItem("asm_token");
  $("adminLeiste").classList.remove("offen");
});

/* =====================================================================
   NEUER EINTRAG (Speichern via GitHub-API)
   ===================================================================== */
$("plusKnopf").addEventListener("click", () => {
  const heute = new Date();
  $("datumFeld").value = heute.toISOString().slice(0, 10);
  $("textDe").value = "";
  $("textEn").value = "";
  $("editorHinweis").className = "hinweis";
  $("editorHinweis").textContent = "";
  $("editorOverlay").classList.add("offen");
  $("textDe").focus();
});

$("editorAbbruch").addEventListener("click", () => $("editorOverlay").classList.remove("offen"));

$("speichernKnopf").addEventListener("click", async () => {
  const datum = $("datumFeld").value;
  const de = $("textDe").value.trim();
  const en = $("textEn").value.trim();

  if (!de) {
    $("editorHinweis").className = "hinweis fehler";
    $("editorHinweis").textContent = t().deFehlt;
    return;
  }

  $("editorHinweis").className = "hinweis";
  $("editorHinweis").textContent = t().speichernLäuft;
  $("speichernKnopf").disabled = true;

  try {
    const url = `https://api.github.com/repos/${REPO_BESITZER}/${REPO_NAME}/contents/${EINTRAGS_DATEI}`;
    const kopf = { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" };

    /* Aktuellen Stand holen (Inhalt + sha) */
    const alt = await fetch(url, { headers: kopf, cache: "no-store" });
    if (!alt.ok) throw new Error();
    const altDaten = await alt.json();
    const liste = JSON.parse(b64ZuUtf8(altDaten.content));

    /* Neuen Eintrag vorne einfügen */
    const neu = { datum, de };
    if (en) neu.en = en;
    liste.unshift(neu);

    /* Neue Version speichern */
    const speichern = await fetch(url, {
      method: "PUT",
      headers: { ...kopf, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Neuer Eintrag ${datum}`,
        content: utf8ZuB64(JSON.stringify(liste, null, 2) + "\n"),
        sha: altDaten.sha
      })
    });
    if (!speichern.ok) throw new Error();

    EINTRAEGE = liste;
    rendern($("suchfeld").value);
    $("editorHinweis").textContent = t().gespeichert;
    setTimeout(() => $("editorOverlay").classList.remove("offen"), 1600);
  } catch {
    $("editorHinweis").className = "hinweis fehler";
    $("editorHinweis").textContent = t().speicherFehler;
  } finally {
    $("speichernKnopf").disabled = false;
  }
});

/* Overlays mit Escape schliessen */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    $("loginOverlay").classList.remove("offen");
    $("editorOverlay").classList.remove("offen");
  }
});

/* =====================================================================
   START
   ===================================================================== */
sprachTexteAnwenden();
ladeEintraege();
if (TOKEN) {
  /* Sitzung besteht noch — Admin-Leiste direkt zeigen */
  $("adminLeiste").classList.add("offen");
}
</script>

</body>
</html>

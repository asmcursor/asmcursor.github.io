<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASM — Tagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --papier: #FBF8F1;
    --tinte: #110F0C;
    --tinte-leicht: #6b6558;
    --linie: #e3ddcf;
    --marker: #f3e6ae;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--papier); }

  body {
    font-family: "Baskerville Old Face", Baskerville, "Libre Baskerville", "Times New Roman", serif;
    color: var(--tinte);
    background: var(--papier);
    line-height: 1.65;
    min-height: 100vh;
  }

  /* ---------- Kopf ---------- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 2rem;
    padding: 2rem 2.25rem 0;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .logo img {
    height: 52px;
    width: auto;
    display: block;
  }

  /* Der Schreib-Cursor aus dem Original-Screenshot */
  .logo .cursor {
    display: inline-block;
    width: 2px;
    height: 46px;
    margin-left: 6px;
    background: var(--tinte);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .logo .cursor { animation: none; }
  }

  /* ---------- Suche ---------- */
  .suche {
    margin-top: 0.8rem;
  }

  .suche input {
    font-family: inherit;
    font-size: 1rem;
    color: var(--tinte);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--tinte);
    padding: 0.3rem 0.1rem;
    width: min(260px, 60vw);
    outline: none;
  }

  .suche input::placeholder {
    color: var(--tinte-leicht);
    font-style: italic;
  }

  .suche input:focus {
    border-bottom-width: 2px;
  }

  .such-status {
    font-size: 0.85rem;
    font-style: italic;
    color: var(--tinte-leicht);
    margin-top: 0.35rem;
    min-height: 1.2em;
    text-align: right;
  }

  /* ---------- Einträge ---------- */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 6rem;
  }

  .eintrag {
    padding: 2.2rem 0;
    border-bottom: 1px solid var(--linie);
  }

  .eintrag:first-child { padding-top: 0; }
  .eintrag:last-child { border-bottom: none; }

  .eintrag time {
    display: block;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tinte-leicht);
    margin-bottom: 0.8rem;
  }

  .eintrag p {
    font-size: 1.08rem;
    margin-bottom: 1em;
  }

  .eintrag p:last-child { margin-bottom: 0; }

  mark {
    background: var(--marker);
    color: inherit;
    padding: 0 0.1em;
  }

  .leer {
    text-align: center;
    font-style: italic;
    color: var(--tinte-leicht);
    padding: 3rem 0;
  }

  @media (max-width: 560px) {
    header { padding: 1.4rem 1.25rem 0; }
    .logo img { height: 42px; }
    .logo .cursor { height: 37px; }
    main { padding-top: 3rem; }
  }
</style>
</head>

<main id="einträge"></main>

<script>
/* =====================================================================
   EINTRÄGE
   Neuen Eintrag immer GANZ OBEN in diese Liste einfügen.
   Format:
     { datum: "JJJJ-MM-TT", text: "Dein Text." }
   Absätze innerhalb eines Eintrags mit \n\n trennen.
   ===================================================================== */
const EINTRAEGE = [
  /* ▼ NEUER EINTRAG HIER ▼ */
  {
    datum: "2026-07-20",
    text: "Dies ist der neueste Eintrag. Er steht ganz oben, weil er in der Liste im Code an erster Stelle steht.\n\nAbsätze trennt man mit einer Leerzeile im Code."
  },
  {
    datum: "2026-07-18",
    text: "Ein zweiter Beispiel-Eintrag. Die Suche oben rechts filtert alle Einträge nach einem Stichwort — probier zum Beispiel das Wort Anfang."
  },
  {
    datum: "2026-07-15",
    text: "Der allererste Eintrag. Er steht zuunterst — der Anfang von allem."
  }
];

/* ---------- Ab hier nichts ändern ---------- */

const MONATE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function datumFormat(iso) {
  const [j, m, t] = iso.split("-").map(Number);
  return `${t}. ${MONATE[m - 1]} ${j}`;
}

function escapeHTML(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function hervorheben(text, begriff) {
  if (!begriff) return text;
  const sicher = begriff.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp(`(${sicher})`, "gi"), "<mark>$1</mark>");
}

function rendern(begriff = "") {
  const main = document.getElementById("einträge");
  const status = document.getElementById("suchStatus");
  const b = begriff.trim().toLowerCase();

  const treffer = b
    ? EINTRAEGE.filter(e => e.text.toLowerCase().includes(b) || datumFormat(e.datum).toLowerCase().includes(b))
    : EINTRAEGE;

  if (treffer.length === 0) {
    main.innerHTML = `<div class="leer">Kein Eintrag enthält „${escapeHTML(begriff.trim())}“.</div>`;
  } else {
    main.innerHTML = treffer.map(e => {
      const absaetze = e.text.split(/\n\s*\n/).map(a =>
        `<p>${hervorheben(escapeHTML(a), b ? begriff.trim() : "")}</p>`
      ).join("");
      return `<article class="eintrag">
        <time datetime="${e.datum}">${datumFormat(e.datum)}</time>
        ${absaetze}
      </article>`;
    }).join("");
  }

  if (b) {
    status.textContent = treffer.length === 1 ? "1 Eintrag gefunden" : `${treffer.length} Einträge gefunden`;
  } else {
    status.textContent = "";
  }
}

const feld = document.getElementById("suchfeld");
feld.addEventListener("input", () => rendern(feld.value));
feld.addEventListener("keydown", e => {
  if (e.key === "Escape") { feld.value = ""; rendern(); feld.blur(); }
});

rendern();
</script>

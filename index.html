<style>
  :root {
    --papier: #FBF8F1;
    --tinte: #110F0C;
    --tinte-leicht: #6b6558;
    --linie: #e3ddcf;
    --marker: #f3e6ae;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--papier); }

  body {
    font-family: "Baskerville Old Face", Baskerville, "Libre Baskerville", "Times New Roman", serif;
    color: var(--tinte);
    background: var(--papier);
    line-height: 1.65;
    min-height: 100vh;
  }

  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: inherit; color: var(--tinte); }

  /* ---------- Startseite (Sprachwahl) ---------- */
  #splash {
    position: fixed;
    inset: 0;
    background: var(--papier);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    transition: opacity .45s ease;
  }

  #splash.aus { opacity: 0; pointer-events: none; }

  .splash-logo { display: flex; align-items: center; }
  .splash-logo img { height: 96px; width: auto; display: block; }
  .splash-logo .cursor { height: 84px; width: 3px; margin-left: 9px; }

  .sprachwahl { position: relative; text-align: center; }

  .sprachwahl > button {
    font-size: 1.05rem;
    font-style: italic;
    color: var(--tinte-leicht);
    border-bottom: 1px solid var(--tinte);
    padding: 0.3rem 0.6rem;
  }

  .sprachwahl > button:hover, .sprachwahl > button:focus-visible { color: var(--tinte); }

  .sprachliste {
    list-style: none;
    margin-top: 0.9rem;
    display: none;
  }

  .sprachwahl.offen .sprachliste { display: block; }

  .sprachliste button {
    font-size: 1.05rem;
    padding: 0.35rem 0.6rem;
    display: block;
    width: 100%;
  }

  .sprachliste button:hover, .sprachliste button:focus-visible { background: var(--marker); }

  /* ---------- Kopf ---------- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 2rem;
    padding: 2rem 2.25rem 0;
    flex-wrap: wrap;
  }

  .logo { display: flex; align-items: center; }
  .logo img { height: 52px; width: auto; display: block; }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 46px;
    margin-left: 6px;
    background: var(--tinte);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

  .suche { margin-top: 0.8rem; }

  .suche input {
    font-size: 1rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--tinte);
    padding: 0.3rem 0.1rem;
    width: min(260px, 60vw);
    outline: none;
  }

  .suche input::placeholder { color: var(--tinte-leicht); font-style: italic; }
  .suche input:focus { border-bottom-width: 2px; }

  .such-status {
    font-size: 0.85rem;
    font-style: italic;
    color: var(--tinte-leicht);
    margin-top: 0.35rem;
    min-height: 1.2em;
    text-align: right;
  }

  /* ---------- Einträge ---------- */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 6rem;
  }

  .eintrag { padding: 2.2rem 0; border-bottom: 1px solid var(--linie); }
  .eintrag:first-child { padding-top: 0; }
  .eintrag:last-child { border-bottom: none; }

  .eintrag time {
    display: block;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tinte-leicht);
    margin-bottom: 0.8rem;
  }

  .eintrag p { font-size: 1.08rem; margin-bottom: 1em; }
  .eintrag p:last-child { margin-bottom: 0; }

  mark { background: var(--marker); color: inherit; padding: 0 0.1em; }

  .leer {
    text-align: center;
    font-style: italic;
    color: var(--tinte-leicht);
    padding: 3rem 0;
  }

  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--tinte-leicht);
    padding: 0 1.5rem 2.5rem;
  }

  /* ---------- Overlays (Login & Neuer Eintrag) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgba(251, 248, 241, 0.55);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }

  .overlay.offen { display: flex; }

  .overlay-inhalt {
    width: min(440px, 100%);
    text-align: center;
  }

  .overlay-inhalt h2 {
    font-weight: 400;
    font-size: 1.15rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.6rem;
  }

  .feld {
    width: 100%;
    font-size: 1rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--tinte);
    padding: 0.4rem 0.1rem;
    outline: none;
    margin-bottom: 1.2rem;
  }

  .feld::placeholder { color: var(--tinte-leicht); font-style: italic; }
  .feld:focus { border-bottom-width: 2px; }

  /* Login-Schlüsselfeld: Cursor/Text mittig */
  #tokenFeld { text-align: center; }

  textarea.feld {
    min-height: 130px;
    resize: vertical;
    line-height: 1.6;
    text-align: left;
  }

  .feld-label {
    display: block;
    text-align: left;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--tinte-leicht);
    margin-bottom: 0.3rem;
  }

  .knopf {
    font-size: 1rem;
    border-bottom: 1px solid var(--tinte);
    padding: 0.3rem 0.5rem;
  }

  .knopf:hover, .knopf:focus-visible { background: var(--marker); }

  .knopf-reihe { display: flex; justify-content: center; gap: 1.8rem; margin-top: 0.4rem; }

  .hinweis {
    font-size: 0.85rem;
    font-style: italic;
    color: var(--tinte-leicht);
    margin-top: 1.4rem;
    min-height: 1.2em;
  }

  .fehler { color: #8a3324; }

  /* Rote XXX (vektorisiert) bei falschem Schlüssel — in Textgrösse */
  .xxx-bild { height: 0.8rem; display: inline-block; vertical-align: baseline; }

  /* Sprachumschalter im Login-Fenster, oben rechts in der Ecke */
  #sprachWechselLogin {
    position: absolute;
    top: 1.4rem;
    right: 2rem;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    color: var(--tinte-leicht);
    border-bottom: 1px solid transparent;
    padding: 0.1rem 0.15rem;
  }

  #sprachWechselLogin:hover, #sprachWechselLogin:focus-visible {
    color: var(--tinte);
    border-bottom-color: var(--tinte);
  }

  .kontakt {
    margin-top: 2.2rem;
    font-size: 0.85rem;
    color: var(--tinte-leicht);
  }

  .kontakt a { color: inherit; }

  /* Nur-Sprache-Modus des Login-Fensters (eingeloggt) */
  #loginOverlay.nur-sprache #tokenFeld,
  #loginOverlay.nur-sprache #loginHinweis,
  #loginOverlay.nur-sprache .kontakt { display: none; }

  /* Bearbeiten/Löschen-Zeile unter Einträgen (nur eingeloggt) */
  .eintrag-ctl {
    margin-top: 0.9rem;
    font-size: 0.8rem;
    font-style: italic;
    color: var(--tinte-leicht);
  }

  .eintrag-ctl button {
    font-size: inherit;
    font-style: inherit;
    color: inherit;
    padding: 0 0.1rem;
  }

  .eintrag-ctl button:hover, .eintrag-ctl button:focus-visible {
    color: var(--tinte);
    text-decoration: underline;
  }

  /* Übersetzungs-Schalter im Editor */
  .schalter {
    display: block;
    margin: -0.4rem 0 1.2rem auto;
    font-size: 0.8rem;
    font-style: italic;
    color: var(--tinte-leicht);
    padding: 0.1rem 0.15rem;
  }

  .schalter:hover, .schalter:focus-visible { color: var(--tinte); text-decoration: underline; }

  /* ---------- Admin-Leiste ---------- */
  #adminLeiste {
    position: fixed;
    right: 1.6rem;
    bottom: 1.6rem;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    z-index: 30;
  }

  #adminLeiste.offen { display: flex; }

  #plusKnopf {
    width: 52px;
    height: 52px;
    border: 1px solid var(--tinte);
    border-radius: 50%;
    font-size: 1.8rem;
    line-height: 1;
    background: var(--papier);
  }

  #plusKnopf:hover, #plusKnopf:focus-visible { background: var(--marker); }

  #abmelden {
    font-size: 0.78rem;
    font-style: italic;
    color: var(--tinte-leicht);
  }

  #abmelden:hover { color: var(--tinte); }

  @media (max-width: 560px) {
    header { padding: 1.4rem 1.25rem 0; }
    .logo img { height: 42px; }
    .logo .cursor { height: 37px; }
    main { padding-top: 3rem; }
    .splash-logo img { height: 68px; }
    .splash-logo .cursor { height: 60px; }
  }
</style>
</head>

<script>
/* =====================================================================
   EINSTELLUNGEN
   ===================================================================== */
const REPO_BESITZER = "asmcursor";
const REPO_NAME     = "asmcursor.github.io";
const EINTRAGS_DATEI = "eintraege.json";

/* Optional: URL eines eigenen DeepL-Proxys (z. B. Cloudflare Worker).
   Leer lassen = kostenloser Standard-Übersetzungsdienst (MyMemory). */
const DEEPL_PROXY_URL = "https://asm-deepl-proxy.asmcursor.workers.dev";

/* ---------- Übersetzungen der Oberfläche ---------- */
const TEXTE = {
  de: {
    suche: "Stichwort suchen …",
    gefunden1: "1 Eintrag gefunden",
    gefundenN: n => `${n} Einträge gefunden`,
    keinTreffer: b => `Kein Eintrag enthält „${b}“.`,
    fusszeile: j => `© ASM ${j} · Alle Rechte vorbehalten`,
    neuerEintrag: "Neuer Eintrag", eintragBearbeiten: "Eintrag bearbeiten",
    speichern: "Speichern", abbrechen: "Abbrechen", abmelden: "Abmelden",
    bearbeiten: "bearbeiten", loeschen: "löschen",
    wirklich: "Wirklich löschen?", ja: "ja", nein: "nein",
    schalterAn: "Automatische Übersetzung: an",
    schalterAus: "Automatische Übersetzung: aus",
    uebersetzt: "Wird übersetzt …",
    uebersetzFehler: "Übersetzung fehlgeschlagen — Text bitte selbst ergänzen.",
    speichernLäuft: "Wird gespeichert …",
    gespeichert: "Gespeichert. Für Besucher sichtbar in ca. einer Minute.",
    speicherFehler: "Speichern fehlgeschlagen — bitte erneut versuchen.",
    nichtGefunden: "Eintrag nicht gefunden — Seite neu laden und erneut versuchen.",
    deFehlt: "Bitte zuerst den deutschen Text schreiben.",
    ladeFehler: "Einträge konnten nicht geladen werden."
  },
  en: {
    suche: "Search keyword …",
    gefunden1: "1 entry found",
    gefundenN: n => `${n} entries found`,
    keinTreffer: b => `No entry contains “${b}”.`,
    fusszeile: j => `© ASM ${j} · All rights reserved`,
    neuerEintrag: "New entry", eintragBearbeiten: "Edit entry",
    speichern: "Save", abbrechen: "Cancel", abmelden: "Log out",
    bearbeiten: "edit", loeschen: "delete",
    wirklich: "Really delete?", ja: "yes", nein: "no",
    schalterAn: "Automatic translation: on",
    schalterAus: "Automatic translation: off",
    uebersetzt: "Translating …",
    uebersetzFehler: "Translation failed — please complete the text yourself.",
    speichernLäuft: "Saving …",
    gespeichert: "Saved. Visible to visitors in about a minute.",
    speicherFehler: "Saving failed — please try again.",
    nichtGefunden: "Entry not found — reload the page and try again.",
    deFehlt: "Please write the German text first.",
    ladeFehler: "Entries could not be loaded."
  }
};

const MONATE_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONATE_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let SPRACHE = "de";
let EINTRAEGE = [];
let TOKEN = sessionStorage.getItem("asm_token") || "";

/* Editor-Zustand */
let BEARBEITEN_ORIGINAL = null;   /* JSON-Schnappschuss des Eintrags im Bearbeiten-Modus, sonst null */
let LOESCH_INDEX = -1;            /* Index des Eintrags mit offener Lösch-Rückfrage */
let UEBERSETZUNG_AN = true;
let FELD_ZUSTAND = { de: null, en: null };  /* null | "user" | "auto" */
let UEBERSETZ_TIMER = null;
let UEBERSETZ_LAUF = 0;

/* =====================================================================
   HILFSFUNKTIONEN
   ===================================================================== */
const $ = id => document.getElementById(id);
const t = () => TEXTE[SPRACHE];

function datumFormat(iso) {
  const [j, m, tg] = iso.split("-").map(Number);
  return SPRACHE === "en"
    ? `${MONATE_EN[m - 1]} ${tg}, ${j}`
    : `${tg}. ${MONATE_DE[m - 1]} ${j}`;
}

function escapeHTML(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function hervorheben(text, begriff) {
  if (!begriff) return text;
  const sicher = begriff.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp(`(${sicher})`, "gi"), "<mark>$1</mark>");
}

/* UTF-8 <-> Base64 (für die GitHub-API) */
function utf8ZuB64(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  }
  return btoa(bin);
}
function b64ZuUtf8(b) {
  const bin = atob(b.replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* =====================================================================
   EINTRÄGE LADEN & ANZEIGEN
   ===================================================================== */
async function ladeEintraege() {
  try {
    const antwort = await fetch(EINTRAGS_DATEI + "?t=" + Date.now(), { cache: "no-store" });
    if (!antwort.ok) throw new Error();
    EINTRAEGE = sortieren(await antwort.json());
  } catch {
    EINTRAEGE = [];
    $("eintraege").innerHTML = `<div class="leer">${t().ladeFehler}</div>`;
    return;
  }
  rendern($("suchfeld").value);
}

/* Absteigend nach Datum sortieren (neuestes zuoberst).
   Bei gleichem Datum bleibt die bisherige Reihenfolge erhalten. */
function sortieren(liste) {
  return liste.sort((a, b) => a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0);
}

function eintragsText(e) {
  return e[SPRACHE] || e.de || e.en || "";
}

function rendern(begriff = "") {
  const main = $("eintraege");
  const status = $("suchStatus");
  const b = begriff.trim().toLowerCase();

  const alle = EINTRAEGE.map((e, i) => ({ e, i }));
  const treffer = b
    ? alle.filter(({ e }) =>
        eintragsText(e).toLowerCase().includes(b) ||
        datumFormat(e.datum).toLowerCase().includes(b))
    : alle;

  if (treffer.length === 0 && b) {
    main.innerHTML = `<div class="leer">${t().keinTreffer(escapeHTML(begriff.trim()))}</div>`;
  } else {
    main.innerHTML = treffer.map(({ e, i }) => {
      const absaetze = eintragsText(e).split(/\n\s*\n/).map(a =>
        `<p>${hervorheben(escapeHTML(a), b ? begriff.trim() : "")}</p>`
      ).join("");
      const ctl = !TOKEN ? "" : (LOESCH_INDEX === i
        ? `<div class="eintrag-ctl">${t().wirklich}
             <button data-tu="ja" data-i="${i}">${t().ja}</button> ·
             <button data-tu="nein" data-i="${i}">${t().nein}</button></div>`
        : `<div class="eintrag-ctl">
             <button data-tu="bearbeiten" data-i="${i}">${t().bearbeiten}</button> ·
             <button data-tu="loeschen" data-i="${i}">${t().loeschen}</button></div>`);
      return `<article class="eintrag">
        <time datetime="${e.datum}">${datumFormat(e.datum)}</time>
        ${absaetze}${ctl}
      </article>`;
    }).join("");
  }

  status.textContent = b
    ? (treffer.length === 1 ? t().gefunden1 : t().gefundenN(treffer.length))
    : "";
}

/* Klicks auf bearbeiten/löschen (Ereignis-Delegation) */
$("eintraege").addEventListener("click", e => {
  const k = e.target.closest("button[data-tu]");
  if (!k || !TOKEN) return;
  const i = Number(k.dataset.i);
  if (k.dataset.tu === "bearbeiten") {
    LOESCH_INDEX = -1;
    editorOeffnen(EINTRAEGE[i]);
  } else if (k.dataset.tu === "loeschen") {
    LOESCH_INDEX = i;
    rendern($("suchfeld").value);
  } else if (k.dataset.tu === "nein") {
    LOESCH_INDEX = -1;
    rendern($("suchfeld").value);
  } else if (k.dataset.tu === "ja") {
    LOESCH_INDEX = -1;
    eintragLoeschen(EINTRAEGE[i]);
  }
});

/* =====================================================================
   SPRACHE & STARTSEITE
   ===================================================================== */
function sprachTexteAnwenden() {
  document.documentElement.lang = SPRACHE;
  $("suchfeld").placeholder = t().suche;
  $("fusszeile").textContent = t().fusszeile(new Date().getFullYear());
  $("editorTitel").textContent = BEARBEITEN_ORIGINAL ? t().eintragBearbeiten : t().neuerEintrag;
  $("speichernKnopf").textContent = t().speichern;
  $("editorAbbruch").textContent = t().abbrechen;
  $("abmelden").textContent = t().abmelden;
  $("uebersetzSchalter").textContent = UEBERSETZUNG_AN ? t().schalterAn : t().schalterAus;
  /* Knopf zeigt jeweils die ANDERE Sprache an */
  $("sprachWechselLogin").textContent = SPRACHE === "de" ? "EN" : "DE";
}

function spracheSetzen(neu) {
  SPRACHE = neu;
  sprachTexteAnwenden();
  rendern($("suchfeld").value);
}

$("sprachKnopf").addEventListener("click", () => {
  const box = $("sprachwahl");
  box.classList.toggle("offen");
  $("sprachKnopf").setAttribute("aria-expanded", box.classList.contains("offen"));
});

document.querySelectorAll(".sprachliste button").forEach(k => {
  k.addEventListener("click", () => {
    spracheSetzen(k.dataset.sprache);
    $("splash").classList.add("aus");
  });
});

/* Sprachumschalter im Login-Fenster: zwischen DE und EN wechseln */
$("sprachWechselLogin").addEventListener("click", () => {
  spracheSetzen(SPRACHE === "de" ? "en" : "de");
});

/* =====================================================================
   SUCHE
   ===================================================================== */
$("suchfeld").addEventListener("input", () => rendern($("suchfeld").value));
$("suchfeld").addEventListener("keydown", e => {
  if (e.key === "Escape") { $("suchfeld").value = ""; rendern(); $("suchfeld").blur(); }
});

/* =====================================================================
   LOGIN (über GitHub-API)
   ===================================================================== */
$("logoKnopf").addEventListener("click", () => {
  $("loginHinweis").className = "hinweis";
  $("loginHinweis").innerHTML = "";
  $("tokenFeld").value = "";
  /* Eingeloggt: gleiches Fenster, aber nur mit Sprachwahl (ohne Strich & Mail) */
  $("loginOverlay").classList.toggle("nur-sprache", !!TOKEN);
  $("loginOverlay").classList.add("offen");
  if (!TOKEN) $("tokenFeld").focus();
});

/* Klick ausserhalb des Feldes schliesst das Login-Fenster */
$("loginOverlay").addEventListener("click", e => {
  if (e.target === $("loginOverlay")) $("loginOverlay").classList.remove("offen");
});

async function anmelden() {

  if (!token) return;
  $("loginHinweis").className = "hinweis";
  $("loginHinweis").textContent = "…";

    const antwort = await fetch(`https://api.github.com/repos/${REPO_BESITZER}/${REPO_NAME}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const daten = await antwort.json();
    if (!antwort.ok || !daten.permissions || !daten.permissions.push) throw new Error();

    sessionStorage.setItem("asm_token", token);

/* =====================================================================
   DATEI SCHREIBEN (gemeinsam für Neu / Bearbeiten / Löschen)
   aenderung(liste) verändert die Liste und gibt sie zurück (oder null bei Fehler)
   ===================================================================== */
async function dateiSchreiben(aenderung, meldung) {
  const url = `https://api.github.com/repos/${REPO_BESITZER}/${REPO_NAME}/contents/${EINTRAGS_DATEI}`;
  const kopf = { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" };

  const alt = await fetch(url + "?t=" + Date.now(), { headers: kopf, cache: "no-store" });
  if (!alt.ok) throw new Error("laden");
  const altDaten = await alt.json();
  const liste = JSON.parse(b64ZuUtf8(altDaten.content));

  let neu = aenderung(liste);
  if (neu === null) throw new Error("nicht-gefunden");
  neu = sortieren(neu);

  const speichern = await fetch(url, {
    method: "PUT",
    headers: { ...kopf, "Content-Type": "application/json" },
    body: JSON.stringify({
      message: meldung,
      content: utf8ZuB64(JSON.stringify(neu, null, 2) + "\n"),
      sha: altDaten.sha
    })
  });
  if (!speichern.ok) throw new Error("speichern");
  return neu;
}

/* In der Liste den Eintrag finden, der dem Schnappschuss entspricht */
function indexVonSchnappschuss(liste, schnappschuss) {
  return liste.findIndex(x => JSON.stringify(x) === schnappschuss);
}

/* =====================================================================
   EDITOR: NEU & BEARBEITEN
   ===================================================================== */
function editorOeffnen(eintrag = null) {
  BEARBEITEN_ORIGINAL = eintrag ? JSON.stringify(eintrag) : null;
  $("editorTitel").textContent = eintrag ? t().eintragBearbeiten : t().neuerEintrag;
  $("datumFeld").value = eintrag ? eintrag.datum : new Date().toISOString().slice(0, 10);
  $("textDe").value = eintrag ? (eintrag.de || "") : "";
  $("textEn").value = eintrag ? (eintrag.en || "") : "";
  /* Auch beim Bearbeiten übersetzt die Automatik weiter: Tippt man im einen
     Feld, wird das andere neu übersetzt (bis man es selbst anfasst). */
  FELD_ZUSTAND = { de: null, en: null };
  $("editorHinweis").className = "hinweis";
  $("editorHinweis").textContent = "";
  $("editorOverlay").classList.add("offen");
  $("textDe").focus();
}

$("plusKnopf").addEventListener("click", () => editorOeffnen());
$("editorAbbruch").addEventListener("click", () => $("editorOverlay").classList.remove("offen"));

$("uebersetzSchalter").addEventListener("click", () => {
  UEBERSETZUNG_AN = !UEBERSETZUNG_AN;
  $("uebersetzSchalter").textContent = UEBERSETZUNG_AN ? t().schalterAn : t().schalterAus;
});

$("speichernKnopf").addEventListener("click", async () => {
  const datum = $("datumFeld").value;
  const de = $("textDe").value.trim();
  const en = $("textEn").value.trim();

  if (!de) {
    $("editorHinweis").className = "hinweis fehler";
    $("editorHinweis").textContent = t().deFehlt;
    return;
  }

  $("editorHinweis").className = "hinweis";
  $("editorHinweis").textContent = t().speichernLäuft;
  $("speichernKnopf").disabled = true;

  const neuEintrag = { datum, de };
  if (en) neuEintrag.en = en;

  try {
    const original = BEARBEITEN_ORIGINAL;
    const neu = await dateiSchreiben(liste => {
      if (original) {
        const idx = indexVonSchnappschuss(liste, original);
        if (idx === -1) return null;
        liste[idx] = neuEintrag;
      } else {
        liste.unshift(neuEintrag);
      }
      return liste;
    }, original ? `Eintrag bearbeitet ${datum}` : `Neuer Eintrag ${datum}`);

    EINTRAEGE = neu;
    rendern($("suchfeld").value);
    $("editorHinweis").textContent = t().gespeichert;
    setTimeout(() => $("editorOverlay").classList.remove("offen"), 1600);
  } catch (fehler) {
    $("editorHinweis").className = "hinweis fehler";
    $("editorHinweis").textContent =
      fehler.message === "nicht-gefunden" ? t().nichtGefunden : t().speicherFehler;
  } finally {
    $("speichernKnopf").disabled = false;
  }
});

/* =====================================================================
   LÖSCHEN
   ===================================================================== */
async function eintragLoeschen(eintrag) {
  const schnappschuss = JSON.stringify(eintrag);
  try {
    const neu = await dateiSchreiben(liste => {
      const idx = indexVonSchnappschuss(liste, schnappschuss);
      if (idx === -1) return null;
      liste.splice(idx, 1);
      return liste;
    }, `Eintrag gelöscht ${eintrag.datum}`);
    EINTRAEGE = neu;
  } catch {
    /* Bei Fehler unverändert lassen */
  }
  rendern($("suchfeld").value);
}

/* =====================================================================
   AUTOMATISCHE ÜBERSETZUNG (Deutsch <-> Englisch/Britisch)
   Übersetzt beim Tippen mit kurzer Verzögerung ins jeweils andere Feld,
   solange das Zielfeld nicht von Hand beschrieben wurde.
   ===================================================================== */
async function uebersetzen(text, von, nach) {
  if (DEEPL_PROXY_URL) {
    const antwort = await fetch(DEEPL_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: [text],
        source_lang: von.toUpperCase(),
        target_lang: nach === "en" ? "EN-GB" : "DE"
      })
    });
    if (!antwort.ok) throw new Error();
    const daten = await antwort.json();
    return daten.translations[0].text;
  }

  /* MyMemory: kostenlos, aber max. ~500 Zeichen pro Anfrage — darum stückweise */
  const paar = von === "de" ? "de|en-GB" : "en-GB|de";
  const absaetze = text.split(/\n\s*\n/);
  const uebersetzteAbsaetze = [];
  for (const absatz of absaetze) {
    if (!absatz.trim()) { uebersetzteAbsaetze.push(""); continue; }
    const stuecke = [];
    let rest = absatz.trim();
    while (rest.length > 0) {
      if (rest.length <= 450) { stuecke.push(rest); break; }
      let schnitt = rest.lastIndexOf(". ", 450);
      if (schnitt < 100) schnitt = rest.lastIndexOf(" ", 450);
      if (schnitt < 1) schnitt = 450;
      stuecke.push(rest.slice(0, schnitt + 1).trim());
      rest = rest.slice(schnitt + 1).trim();
    }
    const teile = [];
    for (const stueck of stuecke) {
      const antwort = await fetch(
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(stueck) + "&langpair=" + encodeURIComponent(paar));
      if (!antwort.ok) throw new Error();
      const daten = await antwort.json();
      if (!daten.responseData || !daten.responseData.translatedText) throw new Error();
      teile.push(daten.responseData.translatedText);
    }
    uebersetzteAbsaetze.push(teile.join(" "));
  }
  return uebersetzteAbsaetze.join("\n\n");
}

function uebersetzungPlanen(von) {
  const nach = von === "de" ? "en" : "de";
  const zielFeld = nach === "de" ? $("textDe") : $("textEn");
  const quellFeld = von === "de" ? $("textDe") : $("textEn");

  if (!UEBERSETZUNG_AN) return;
  if (FELD_ZUSTAND[nach] === "user") return;  /* Zielfeld wurde von Hand beschrieben */

  clearTimeout(UEBERSETZ_TIMER);
  UEBERSETZ_TIMER = setTimeout(async () => {
    const quelle = quellFeld.value.trim();
    if (!quelle) { if (FELD_ZUSTAND[nach] === "auto") { zielFeld.value = ""; FELD_ZUSTAND[nach] = null; } return; }
    const lauf = ++UEBERSETZ_LAUF;
    $("editorHinweis").className = "hinweis";
    $("editorHinweis").textContent = t().uebersetzt;
    try {
      const ergebnis = await uebersetzen(quelle, von, nach);
      if (lauf !== UEBERSETZ_LAUF) return;              /* veraltete Antwort verwerfen */
      if (FELD_ZUSTAND[nach] === "user") return;
      zielFeld.value = ergebnis;
      FELD_ZUSTAND[nach] = "auto";
      $("editorHinweis").textContent = "";
    } catch {
      if (lauf !== UEBERSETZ_LAUF) return;
      $("editorHinweis").className = "hinweis fehler";
      $("editorHinweis").textContent = t().uebersetzFehler;
    }
  }, 900);
}

$("textDe").addEventListener("input", () => {
  FELD_ZUSTAND.de = "user";
  uebersetzungPlanen("de");
});

$("textEn").addEventListener("input", () => {
  FELD_ZUSTAND.en = "user";
  uebersetzungPlanen("en");
});

/* Overlays mit Escape schliessen */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    $("loginOverlay").classList.remove("offen");
    $("editorOverlay").classList.remove("offen");
  }
});

ladeEintraege();

  $("adminLeiste").classList.add("offen");
}
